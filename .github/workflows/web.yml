# Deploy the BidScope web tester to GitHub Pages.
#
# The site is a static page plus the Go profiler compiled to WebAssembly:
# everything runs in the visitor's browser, so the profiler stays
# local-first (no uploads, no servers) even as a hosted page.
name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Build web tester
        run: make web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
