name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Build
        run: go build ./...
      - name: Build WASM web tester
        run: GOOS=js GOARCH=wasm go build -o /tmp/bidscope.wasm ./web/wasm
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
